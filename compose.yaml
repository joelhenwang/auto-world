# Stage 0 Compose skeleton — PostgreSQL + pgvector only.
# Application / frontend / Stage 4 services are added by later tasks.
# Handbook: 20 §5.

name: fictional-world

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fictional-world-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-fictional_world}
      POSTGRES_USER: ${DATABASE_USER:-fictional_world}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-local}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - fictional_world_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-fictional_world} -d ${DATABASE_NAME:-fictional_world}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  fictional_world_pgdata:
    name: fictional-world-pgdata
