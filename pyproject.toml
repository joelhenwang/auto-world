[project]
name = "fictional-world"
version = "0.1.0"
description = "Autonomous fictional-world simulation backend (Stage 0 bootstrap)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "basedpyright>=1.29.0",
]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/fictional_world"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]
extend-exclude = [
    "autonomous_world_build_handbook_v1_0",
    "prototypes",
    "docs",
    ".venv",
]

[tool.ruff.lint]
# Minimal bootstrap rules. Full rule set and pre-commit belong to S0-ENG-002.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
# Minimal wiring only. Strict gate and profile validation belong to S0-ENG-002.
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["backend/src"]
exclude = ["**/__pycache__", ".venv", "prototypes", "autonomous_world_build_handbook_v1_0"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "-q"
