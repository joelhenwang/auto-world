[project]
name = "fictional-world"
version = "0.1.0"
description = "Autonomous fictional-world simulation backend (Stage 0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "basedpyright>=1.29.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-socket>=0.7.0",
    "testcontainers>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/fictional_world"]

[tool.hatch.build.targets.wheel.sources]
"backend/src" = ""

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests", "scripts", "tools"]
extend-exclude = [
    "autonomous_world_build_handbook_v1_0",
    "prototypes",
    "docs",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "C4", "DTZ", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20", "S603", "S607"]
"backend/tests/**" = ["S101", "S603", "S607"]
"tools/**" = ["T20"]
"backend/migrations/**" = ["I001", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["backend/src", "scripts", "tools"]
exclude = [
    "**/__pycache__",
    ".venv",
    "prototypes",
    "autonomous_world_build_handbook_v1_0",
    "docs",
    "backend/tests",
]
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
pythonpath = ["backend/src", ".", "tools"]
testpaths = ["backend/tests"]
addopts = "-q -m 'not openrouter_live and not local_model_live and not image_live and not soak'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
