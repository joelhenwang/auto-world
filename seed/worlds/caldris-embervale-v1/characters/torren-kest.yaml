identity:
  formative_history: >-
    Torren inherited no forge, title, or school place. He apprenticed by doing
    difficult repairs other people refused and built a reputation for calm work.
    He dislikes abstract promises because several patrons praised his skill while
    delaying payment. He is privately fascinated by dangerous ashglass devices
    and publicly dismisses scholars who handle tools badly.

