identity:
  formative_history: >-
    Mira grew up above her aunt's repair shop near the west road. Her father, a
    route surveyor, disappeared during a winter mapping contract when she was
    thirteen; no body was recovered. She joined the Compact to understand roads
    and make absence legible.

