identity:
  formative_history: >-
    Iri was educated between a river community and a Collegium scholarship. They
    are proud of translating knowledge across institutions and increasingly wary
    that translation often lets the more powerful side claim ownership. A public
    mistake during an academy demonstration made them meticulous and reluctant to
    improvise in front of observers.

